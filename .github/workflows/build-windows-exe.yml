name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install pyinstaller

      - name: Build App1
        run: |
          pyinstaller --noconfirm --onefile --windowed app1_outline_generator_qt.py

      - name: Build App2
        run: |
          pyinstaller --noconfirm --onefile --windowed app2_novel_writer_qt.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovelForge-Windows
          path: dist/*.exe
